# room_baram (2026-11-05): label correction settings. Map frame, metres.
note: >-
  Detection tags corrected by hand against the 27 items in the room (room_baram_labels.txt); same-tag association;
  cup, headphone, plate exported from one observation; the single items below merged into one object each across views;
  bowl, spoon, toothbrush placed from the views (no LiDAR points); desks fitted on the desk-height LiDAR slice, 2 per room.
  Keyframe 0 not used in 3D (taken before the localization pose was set).
exclude_keyframes: [0]
single_view_tags: [cup, headphone, plate]
surfaces: {desk: 0.29, floor: -0.39}        # desk top and floor height in the map frame
# one object per tag. extent: search radius for LiDAR points [m]; size: placeholder box [w, d, h] when no LiDAR point fits
items:
  stapler:        {extent: 0.40, size: [0.28, 0.07, 0.10]}
  keyboard:       {extent: 0.75, size: [0.44, 0.14, 0.03]}
  headphone:      {extent: 0.40, size: [0.20, 0.10, 0.20], position: [4.40, -4.85]}   # estimate fell behind the wall: mean of its 2 LiDAR observations
  vacuum cleaner: {extent: 1.30, size: [0.45, 0.35, 0.60], surface: floor}
  fan:            {extent: 0.55, size: [0.25, 0.15, 0.25]}
  microwave:      {extent: 0.80, size: [0.46, 0.34, 0.26]}
  ketchup:        {extent: 0.30, size: [0.07, 0.07, 0.25]}
  bottle:         {extent: 0.40, size: [0.10, 0.10, 0.30]}
  plate:          {extent: 0.40, size: [0.24, 0.24, 0.03]}
  blanket:        {extent: 0.55, size: [0.45, 0.30, 0.12]}
  refrigerator:   {extent: 1.00, size: [0.50, 0.50, 0.60], surface: floor}
  cup:            {extent: 0.25, size: [0.09, 0.09, 0.10]}
  bowl:           {extent: 0.25, size: [0.15, 0.15, 0.08]}
  spoon:          {inside: bowl, size: [0.04, 0.04, 0.22]}
  toothbrush:     {inside: cup, size: [0.04, 0.04, 0.22]}
desks:
  tag: desk
  slice_z: [0.20, 0.36]                      # desk-top height band of the LiDAR map
  keep_ids: {A1: 18, A2: 17, B1: 6, B2: 3, C1: 44, D1: 56, D2: 11}   # keep the object ids of the first build (others get new ids)
  seeds:                                     # one polygon [x, y] around each desk, read from the desk-height slice
    A1: [[-1.70, -4.00], [-1.45, -2.86], [-0.78, -2.86], [-0.78, -3.55], [-1.05, -4.00]]
    A2: [[-1.72, -4.05], [-1.72, -4.50], [-0.40, -4.85], [-0.35, -4.15]]
    B1: [[0.40, 3.10], [0.32, 2.60], [1.42, 2.47], [1.50, 2.97]]
    B2: [[1.50, 2.97], [1.42, 2.47], [1.27, 1.55], [1.92, 1.55], [2.12, 2.82]]
    C1: [[2.86, -5.85], [2.86, -5.20], [3.55, -5.20], [4.15, -5.30], [4.12, -6.10]]
    C2: [[3.95, -5.25], [4.15, -4.30], [4.82, -4.30], [4.62, -5.75], [4.15, -5.75]]
    D1: [[4.90, 2.05], [4.90, 1.40], [5.70, 1.20], [6.25, 1.25], [6.25, 1.75]]
    D2: [[5.40, -0.15], [5.55, 1.20], [6.25, 1.20], [6.10, -0.20]]
